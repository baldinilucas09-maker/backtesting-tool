# Variante "démo" de config/strategy.yaml : seuil de confluence assoupli
# (3 conditions sur 4 au lieu de 4/4 strict) pour observer des trades sur le
# jeu de données synthétique (marche aléatoire) fourni par défaut. Les vraies
# données de marché, plus structurées, produiront naturellement plus
# d'alignements complets des 4 conditions que ce random-walk de démonstration.
#
# Usage : python scripts/run_backtest.py --config config/strategy_relaxed_demo.yaml

timeframes:
  ltf: "5min"
  htf: "4h"

data:
  raw_file: "data/raw/MGC_5min_synthetic.csv"
  timezone: "UTC"

swings:
  left_bars: 2
  right_bars: 2

liquidity_sweeps:
  lookback_swings: 20
  max_bars_since_sweep: 12

order_blocks:
  impulse_atr_mult: 1.5
  atr_period: 14
  max_ob_age_bars: 40

fair_value_gaps:
  min_gap_atr_mult: 0.0
  max_fvg_age_bars: 30

volume_profile:
  window_bars: 48
  n_bins: 30

vwap:
  anchor: "session"
  session_start_utc: "00:00"

confluence:
  proximity_atr_mult: 0.5
  min_score: 3   # <-- assoupli (3/4 au lieu de 4/4)
  required:
    sweep: true
    order_block: true
    fvg: true
    poc_or_avwap: true

risk:
  initial_capital: 10000
  risk_per_trade_pct: 1.0
  stop_buffer_ticks: 2
  tick_size: 0.1
  tick_value: 1.0
  r_multiples: [1, 2, 3]
  scale_out_fractions: [0.34, 0.33, 0.33]
  max_concurrent_trades: 1
  commission_per_contract: 0.74
  slippage_ticks: 1.0

session_filter:
  enabled: false
  start_utc: "12:00"
  end_utc: "20:00"
